<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tribes of Terra — a pixel god game</title>
  <meta name="description" content="A pixel civilization simulation on a 3D globe. Watch tribes farm, mine, ally and fight. Play god.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='2' y='0' width='4' height='8' fill='%232e6ea6'/><rect x='0' y='2' width='8' height='4' fill='%232e6ea6'/><rect x='1' y='1' width='6' height='6' fill='%232e6ea6'/><rect x='2' y='2' width='3' height='2' fill='%2372b04a'/><rect x='4' y='4' width='2' height='2' fill='%2372b04a'/></svg>">
</head>
<body>
  <canvas id="globe"></canvas>

  <header id="topbar" class="panel">
    <h1>TRIBES <span>of</span> TERRA</h1>
    <div id="date">Year 1</div>
    <div class="group" id="speed">
      <button data-speed="0" title="Pause (Space)">❚❚</button>
      <button data-speed="1" title="Normal speed">▶</button>
      <button data-speed="3" title="Fast">▶▶</button>
      <button data-speed="8" title="Very fast">▶▶▶</button>
    </div>
    <div class="group" id="worldctl">
      <input id="seed" type="text" spellcheck="false" maxlength="24" title="World seed: same seed, same world">
      <button id="newworld" title="Make a new world from this seed">New world</button>
      <button id="randworld" title="Random seed">🎲</button>
    </div>
    <button id="pixmode" title="Auto: retro far away, sharp up close">Pixels: Auto</button>
  </header>

  <nav id="powers" class="panel">
    <h2>GOD POWERS</h2>
    <div id="powerlist"></div>
    <p class="hint">Pick a power, then click the globe.<br>Right-click or Esc to cancel.</p>
  </nav>

  <aside id="tribes" class="panel">
    <h2>TRIBES <span id="tribecount"></span></h2>
    <div id="tribelist"></div>
  </aside>

  <section id="log" class="panel">
    <h2>CHRONICLE</h2>
    <ul id="loglist"></ul>
  </section>

  <section id="inspect" class="panel"></section>

  <div id="labels"></div>
  <div id="toast"></div>
  <div id="help">Drag to spin · Scroll to zoom in close and see the villages · Click a tribe to fly there</div>
  <noscript><p class="panel" style="position:fixed;top:40%;left:30%">This game needs JavaScript.</p></noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
